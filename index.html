<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="BioSmart"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <link rel="manifest" href="manifest.json"/>
  <title>BioSmart 120g</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;height:100dvh;background:#000;overflow:hidden;-webkit-text-size-adjust:100%}
    body{position:fixed;width:100%;color:#fff;font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
    #root{height:100%;height:100dvh}
    *{-webkit-tap-highlight-color:transparent}
    ::-webkit-scrollbar{display:none}
    #splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity 0.6s ease}
    #splash.hide{opacity:0;pointer-events:none}
    #splash-ring{width:90px;height:90px;border-radius:50%;border:2px solid rgba(16,185,129,0.2);display:flex;align-items:center;justify-content:center;position:relative;animation:splashRing 2s ease infinite}
    #splash-ring::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(16,185,129,0.08);animation:splashRing 2.4s ease infinite reverse}
    #splash-icon{font-size:44px;animation:splashPulse 1.6s ease infinite}
    #splash-name{font-size:13px;font-weight:700;letter-spacing:6px;color:#10B981}
    #splash-sub{font-size:9px;color:rgba(255,255,255,0.25);letter-spacing:4px}
    #splash-bar{width:120px;height:2px;background:rgba(255,255,255,0.08);border-radius:1px;overflow:hidden;margin-top:4px}
    #splash-fill{height:100%;background:linear-gradient(90deg,#10B981,#34d399);border-radius:1px;animation:splashLoad 1.8s ease forwards}
    @keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    @keyframes splashRing{0%,100%{opacity:0.4;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
    @keyframes splashLoad{0%{width:0%}60%{width:70%}100%{width:100%}}
    @keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pageInFast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes ringPop{0%{transform:scale(0.7);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes glowPulse{0%,100%{box-shadow:0 0 16px rgba(16,185,129,0.2)}50%{box-shadow:0 0 36px rgba(16,185,129,0.5)}}
    @keyframes scanLine{0%{top:0%}100%{top:100%}}
    @keyframes onboardIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes cardFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(-1deg)}}
    @keyframes badgePop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
  </style>
</head>
<body>
<div id="splash">
  <div id="splash-ring"><div id="splash-icon">🍃</div></div>
  <div id="splash-name">BIOSMART 120g</div>
  <div id="splash-sub">INITIALIZING SENSORS</div>
  <div id="splash-bar"><div id="splash-fill"></div></div>
</div>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const DECAY=0.0055,EM="#10B981",DEF=[35.1856,33.3823];
const ROOMS=["Living Room","Bedroom","Office","Kitchen","Baby Room","Gym","Studio","Hallway"];
const ROOM_ICONS={"Living Room":"🛋️","Bedroom":"🛏️","Office":"💻","Kitchen":"🍳","Baby Room":"🍼","Gym":"💪","Studio":"🎨","Hallway":"🚪"};

let _m={};
const S={
  g:k=>{try{return localStorage.getItem(k)}catch{return _m[k]??null}},
  s:(k,v)=>{try{localStorage.setItem(k,v)}catch{_m[k]=v}}
};
const vibe=t=>{try{if(navigator.vibrate)navigator.vibrate(t==="heavy"?[30,10,30]:t==="med"?[20]:[8])}catch{}};

// ── Tap ───────────────────────────────────────────────────────────────────────
function Tap({children,onTap,style={},off=false,vt="light"}){
  const [dn,setDn]=useState(false),frd=useRef(false);
  return(
    <div style={{...style,transform:dn&&!off?"scale(0.94)":"scale(1)",transition:dn?"transform 0.07s ease":"transform 0.3s cubic-bezier(0.34,1.56,0.64,1)",touchAction:"manipulation",cursor:off?"default":"pointer",userSelect:"none",WebkitUserSelect:"none",WebkitTapHighlightColor:"transparent"}}
      onPointerDown={e=>{if(off)return;e.currentTarget.setPointerCapture(e.pointerId);setDn(true);frd.current=false;vibe(vt)}}
      onPointerUp={()=>{setDn(false);if(!off&&!frd.current){frd.current=true;onTap?.()}}}
      onPointerCancel={()=>setDn(false)} onPointerLeave={()=>setDn(false)}>
      {children}
    </div>
  );
}

// ── Glass ─────────────────────────────────────────────────────────────────────
const Glass=({children,style={},glow=false,p=20,animate=false})=>(
  <div style={{background:"rgba(255,255,255,0.042)",backdropFilter:"blur(24px)",WebkitBackdropFilter:"blur(24px)",border:"1px solid rgba(255,255,255,0.085)",borderRadius:22,padding:p,
    boxShadow:glow?"0 0 40px rgba(16,185,129,0.12),0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08)":"0 4px 24px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05)",
    animation:animate?"cardFloat 4s ease infinite":undefined,...style}}>{children}</div>
);

// ── Gauge ─────────────────────────────────────────────────────────────────────
function Gauge({val,anim}){
  const R=108,CX=140,CY=140,SW=13,circ=2*Math.PI*R,off=circ*(1-anim/100);
  const c=val>60?EM:val>30?"#F59E0B":"#EF4444";
  const c2=val>60?"#34d399":val>30?"#fbbf24":"#f87171";
  return(
    <svg width="280" height="280" style={{willChange:"transform"}}>
      <defs>
        <linearGradient id="gG" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor={c2}/><stop offset="100%" stopColor={c}/>
        </linearGradient>
        <filter id="gF"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      {/* Track */}
      <circle cx={CX} cy={CY} r={R} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth={SW}/>
      {/* Tick marks */}
      {Array.from({length:60},(_,i)=>{
        const a=(i/60)*360-90,rad=a*Math.PI/180,big=i%5===0,on=i/60<=anim/100;
        const r1=big?R-18:R-14,r2=R-22;
        return<line key={i} x1={CX+r1*Math.cos(rad)} y1={CY+r1*Math.sin(rad)} x2={CX+r2*Math.cos(rad)} y2={CY+r2*Math.sin(rad)} stroke={on?c:"rgba(255,255,255,0.07)"} strokeWidth={big?"2":"1"} strokeLinecap="round"/>;
      })}
      {/* Main arc */}
      <circle cx={CX} cy={CY} r={R} fill="none" stroke="url(#gG)" strokeWidth={SW} strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={off} transform={`rotate(-90 ${CX} ${CY})`} style={{transition:"stroke-dashoffset 2s cubic-bezier(0.16,1,0.3,1)",willChange:"stroke-dashoffset"}} filter="url(#gF)"/>
      {/* Glow dot at arc end */}
      {anim>2&&(()=>{const a=(anim/100*360-90)*Math.PI/180;return<circle cx={CX+R*Math.cos(a)} cy={CY+R*Math.sin(a)} r="7" fill={c} filter="url(#glow)"/>})()}
      {/* Inner rings */}
      <circle cx={CX} cy={CY} r="72" fill="none" stroke="rgba(255,255,255,0.025)" strokeWidth="1"/>
      <circle cx={CX} cy={CY} r="52" fill="none" stroke="rgba(255,255,255,0.015)" strokeWidth="1"/>
      {/* Center dot */}
      <circle cx={CX} cy={CY} r="5" fill={c} opacity="0.6"/>
    </svg>
  );
}

// ── Icons ─────────────────────────────────────────────────────────────────────
const MonI=({a})=><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.5"/><circle cx="12" cy="12" r="3" fill={a?EM:"currentColor"}/><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>;
const SynI=({a})=><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 12a9 9 0 0 1-15 6.7L3 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><path d="M17 8h4V4M7 16H3v4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const ScanI=({a})=><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="6" height="6" rx="1" stroke="currentColor" strokeWidth="1.5"/><rect x="15" y="3" width="6" height="6" rx="1" stroke="currentColor" strokeWidth="1.5"/><rect x="3" y="15" width="6" height="6" rx="1" stroke="currentColor" strokeWidth="1.5"/><circle cx="18" cy="18" r="3" stroke={a?EM:"currentColor"} strokeWidth="1.5"/><circle cx="18" cy="18" r="1" fill={a?EM:"currentColor"}/></svg>;
const DocI=({a})=><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" strokeWidth="1.5"/><path d="M8 8h8M8 12h8M8 16h5" stroke={a?EM:"currentColor"} strokeWidth="1.5" strokeLinecap="round"/></svg>;

// ── Dock ──────────────────────────────────────────────────────────────────────
function Dock({tab,setTab}){
  const tabs=[{id:"monitor",l:"Monitor",I:MonI},{id:"biosync",l:"Bio-Sync",I:SynI},{id:"aiscan",l:"AI Scan",I:ScanI},{id:"data",l:"Datasheet",I:DocI}];
  return(
    <div style={{flexShrink:0,display:"flex",justifyContent:"center",alignItems:"flex-end",padding:"8px 16px",paddingBottom:"calc(12px + env(safe-area-inset-bottom,0px))",background:"linear-gradient(to top,rgba(0,0,0,0.97) 60%,transparent)",position:"relative",zIndex:50}}>
      <div style={{display:"flex",gap:3,background:"rgba(255,255,255,0.05)",backdropFilter:"blur(40px)",WebkitBackdropFilter:"blur(40px)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:32,padding:"7px 9px",boxShadow:"0 -2px 40px rgba(0,0,0,0.6),0 0 0 0.5px rgba(255,255,255,0.04),inset 0 1px 0 rgba(255,255,255,0.07)"}}>
        {tabs.map(({id,l,I})=>{const on=tab===id;return(
          <Tap key={id} onTap={()=>setTab(id)} style={{background:on?"rgba(16,185,129,0.14)":"transparent",border:on?"1px solid rgba(16,185,129,0.3)":"1px solid transparent",borderRadius:24,padding:"10px 15px",color:on?EM:"rgba(255,255,255,0.32)",display:"flex",flexDirection:"column",alignItems:"center",gap:4,boxShadow:on?"0 0 24px rgba(16,185,129,0.25),inset 0 1px 0 rgba(16,185,129,0.2)":"none",minWidth:62,transition:"all 0.3s cubic-bezier(0.34,1.56,0.64,1)"}}>
            <I a={on}/><span style={{fontSize:9,fontWeight:600,letterSpacing:0.8,transition:"color 0.3s"}}>{l.toUpperCase()}</span>
          </Tap>
        )})}
      </div>
    </div>
  );
}

// ── ONBOARDING ────────────────────────────────────────────────────────────────
function Onboarding({onComplete}){
  const [step,setStep]=useState(0);
  const [name,setName]=useState("");
  const [date,setDate]=useState("");
  const [room,setRoom]=useState("");
  const today=new Date().toISOString().split("T")[0];

  const finish=()=>{
    const pd=date?new Date(date):new Date();
    const days=(Date.now()-pd.getTime())/86400000;
    const life=Math.max(0,100-days*DECAY*100);
    S.s("bs_life",life.toString());S.s("bs_date",Date.now().toString());
    S.s("bs_name",name||"My BioSmart");S.s("bs_room",room||"Living Room");
    S.s("bs_purchase",pd.getTime().toString());S.s("bs_onboarded","1");
    onComplete({life,room:room||"Living Room",deviceName:name||"My BioSmart"});
  };

  // progress %
  const pct=[0,33,66,100][step];

  return(
    <div style={{height:"100dvh",display:"flex",flexDirection:"column",background:"#000",overflow:"hidden"}}>
      {/* Ambient glow */}
      <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse 90% 60% at 50% -5%,rgba(16,185,129,0.16) 0%,transparent 65%)",pointerEvents:"none"}}/>

      {/* Progress bar */}
      <div style={{height:2,background:"rgba(255,255,255,0.06)",flexShrink:0,position:"relative",zIndex:2}}>
        <div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,#10B981,#34d399)",transition:"width 0.5s cubic-bezier(0.34,1.56,0.64,1)"}}/>
      </div>

      <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",padding:"0 28px",paddingTop:"env(safe-area-inset-top,0px)",position:"relative",zIndex:2,overflowY:"auto"}}>

        {/* STEP 0 — WELCOME */}
        {step===0&&(
          <div style={{animation:"onboardIn 0.5s cubic-bezier(0.34,1.56,0.64,1)"}}>
            <div style={{textAlign:"center",marginBottom:36}}>
              <div style={{width:100,height:100,borderRadius:28,background:"rgba(16,185,129,0.1)",border:"1px solid rgba(16,185,129,0.25)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 24px",fontSize:52,animation:"floatUp 3s ease infinite",boxShadow:"0 0 60px rgba(16,185,129,0.15)"}}>🍃</div>
              <h1 style={{fontSize:32,fontWeight:800,letterSpacing:-1.5,marginBottom:10,lineHeight:1.1}}>Welcome to<br/><span style={{color:EM}}>BioSmart 120g</span></h1>
              <p style={{fontSize:14,color:"rgba(255,255,255,0.4)",lineHeight:1.8}}>Activated virgin biochar air purifier.<br/>Smart monitoring in 3 quick steps.</p>
            </div>
            {/* Feature pills */}
            <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:36}}>
              {[["📅","Track filter life from day one"],["🏠","AI placement tips for your room"],["🌡️","Live temperature, humidity & dust"]].map(([ic,tx])=>(
                <div key={tx} style={{display:"flex",alignItems:"center",gap:14,padding:"13px 16px",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14}}>
                  <span style={{fontSize:20,flexShrink:0}}>{ic}</span>
                  <span style={{fontSize:13,color:"rgba(255,255,255,0.6)",fontWeight:500}}>{tx}</span>
                </div>
              ))}
            </div>
            <Tap onTap={()=>setStep(1)} vt="med" style={{width:"100%",padding:"18px",borderRadius:20,textAlign:"center",background:"rgba(16,185,129,0.13)",border:"1px solid rgba(16,185,129,0.4)",color:EM,fontSize:13,fontWeight:700,letterSpacing:3,boxShadow:"0 0 40px rgba(16,185,129,0.18)",animation:"glowPulse 2.5s ease infinite"}}>
              GET STARTED →
            </Tap>
          </div>
        )}

        {/* STEP 1 — PURCHASE DATE */}
        {step===1&&(
          <div style={{animation:"onboardIn 0.45s cubic-bezier(0.34,1.56,0.64,1)"}}>
            <div style={{width:52,height:52,borderRadius:16,background:"rgba(16,185,129,0.1)",border:"1px solid rgba(16,185,129,0.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,marginBottom:20,animation:"ringPop 0.5s cubic-bezier(0.34,1.56,0.64,1)"}}>📅</div>
            <h2 style={{fontSize:26,fontWeight:800,letterSpacing:-1,marginBottom:8,lineHeight:1.2}}>When did you<br/><span style={{color:EM}}>activate your filter?</span></h2>
            <p style={{fontSize:13,color:"rgba(255,255,255,0.38)",lineHeight:1.75,marginBottom:28}}>We use this to calculate the exact remaining filter life based on the 180-day biochar lifespan and 0.55% daily decay rate.</p>

            <label style={{fontSize:10,letterSpacing:2.5,color:"rgba(255,255,255,0.3)",fontWeight:700,display:"block",marginBottom:10}}>ACTIVATION DATE</label>
            <input type="date" max={today} value={date} onChange={e=>setDate(e.target.value)}
              style={{width:"100%",padding:"17px 16px",background:"rgba(255,255,255,0.055)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:16,color:"#fff",fontSize:16,fontFamily:"'Space Grotesk',sans-serif",outline:"none",WebkitAppearance:"none",colorScheme:"dark",marginBottom:10,transition:"border-color 0.2s"}}/>

            {date&&(()=>{
              const days=(Date.now()-new Date(date).getTime())/86400000;
              const life=Math.max(0,100-days*DECAY*100);
              const c=life>60?EM:life>30?"#F59E0B":"#EF4444";
              return(
                <div style={{padding:"13px 16px",background:`${c}0d`,border:`1px solid ${c}33`,borderRadius:14,marginBottom:24,animation:"fadeUp 0.3s ease",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:12,color:"rgba(255,255,255,0.5)"}}>Filter life remaining</span>
                  <span style={{fontSize:18,fontWeight:800,color:c}}>{life.toFixed(1)}%</span>
                </div>
              );
            })()}

            {!date&&<p style={{fontSize:11,color:"rgba(255,255,255,0.2)",textAlign:"center",marginBottom:24}}>Leave blank to start tracking from today</p>}

            <div style={{display:"flex",gap:10}}>
              <Tap onTap={()=>setStep(0)} style={{flex:1,padding:"16px",borderRadius:16,textAlign:"center",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",color:"rgba(255,255,255,0.38)",fontSize:13,fontWeight:600}}>← Back</Tap>
              <Tap onTap={()=>setStep(2)} vt="med" style={{flex:2,padding:"16px",borderRadius:16,textAlign:"center",background:"rgba(16,185,129,0.12)",border:"1px solid rgba(16,185,129,0.4)",color:EM,fontSize:13,fontWeight:700,letterSpacing:2}}>NEXT →</Tap>
            </div>
          </div>
        )}

        {/* STEP 2 — ROOM */}
        {step===2&&(
          <div style={{animation:"onboardIn 0.45s cubic-bezier(0.34,1.56,0.64,1)"}}>
            <div style={{width:52,height:52,borderRadius:16,background:"rgba(16,185,129,0.1)",border:"1px solid rgba(16,185,129,0.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,marginBottom:20,animation:"ringPop 0.5s cubic-bezier(0.34,1.56,0.64,1)"}}>🏠</div>
            <h2 style={{fontSize:26,fontWeight:800,letterSpacing:-1,marginBottom:8,lineHeight:1.2}}>Where will you<br/><span style={{color:EM}}>place it?</span></h2>
            <p style={{fontSize:13,color:"rgba(255,255,255,0.38)",lineHeight:1.75,marginBottom:24}}>AI will give personalised placement tips and sensor thresholds optimised for your room type.</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:28}}>
              {ROOMS.map((r,i)=>{const on=room===r;return(
                <Tap key={r} onTap={()=>setRoom(r)} style={{padding:"14px 12px",borderRadius:18,background:on?"rgba(16,185,129,0.12)":"rgba(255,255,255,0.04)",border:`1px solid ${on?"rgba(16,185,129,0.4)":"rgba(255,255,255,0.07)"}`,display:"flex",alignItems:"center",gap:10,boxShadow:on?"0 0 20px rgba(16,185,129,0.2)":"none",transition:"all 0.25s cubic-bezier(0.34,1.56,0.64,1)",animation:`fadeUp ${0.1+i*0.05}s ease`}}>
                  <span style={{fontSize:22}}>{ROOM_ICONS[r]}</span>
                  <span style={{fontSize:12,fontWeight:600,color:on?"#fff":"rgba(255,255,255,0.45)",transition:"color 0.2s"}}>{r}</span>
                  {on&&<div style={{marginLeft:"auto",width:8,height:8,borderRadius:"50%",background:EM,animation:"badgePop 0.3s cubic-bezier(0.34,1.56,0.64,1)"}}/>}
                </Tap>
              )})}
            </div>
            <div style={{display:"flex",gap:10}}>
              <Tap onTap={()=>setStep(1)} style={{flex:1,padding:"16px",borderRadius:16,textAlign:"center",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",color:"rgba(255,255,255,0.38)",fontSize:13,fontWeight:600}}>← Back</Tap>
              <Tap onTap={()=>setStep(3)} vt="med" style={{flex:2,padding:"16px",borderRadius:16,textAlign:"center",background:"rgba(16,185,129,0.12)",border:`1px solid rgba(16,185,129,${room?0.45:0.15})`,color:room?EM:"rgba(16,185,129,0.3)",fontSize:13,fontWeight:700,letterSpacing:2,transition:"all 0.3s"}}>NEXT →</Tap>
            </div>
          </div>
        )}

        {/* STEP 3 — NAME */}
        {step===3&&(
          <div style={{animation:"onboardIn 0.45s cubic-bezier(0.34,1.56,0.64,1)"}}>

function EnvWidget({room}){
  const base={temp:22.4,humid:54,aqi:28,dust:0.06,voc:0.08};
  const [v,setV]=useState(base);
  const [prev,setPrev]=useState(base);
  const [tick,setTick]=useState(0);
  useEffect(()=>{
    const id=setInterval(()=>{
      setV(c=>{
        const n={
          temp:  +Math.max(15,Math.min(35,(c.temp  +(Math.random()-.5)*.4))).toFixed(1),
          humid: +Math.max(20,Math.min(90,(c.humid +(Math.random()-.5)*1.2))).toFixed(1),
          aqi:   Math.max(5, Math.round(c.aqi  +(Math.random()-.48)*2)),
          dust:  +Math.max(0,Math.min(0.5,(c.dust  +(Math.random()-.5)*.008))).toFixed(3),
          voc:   +Math.max(0,Math.min(1,  (c.voc   +(Math.random()-.5)*.006))).toFixed(3),
        };
        setPrev(c);return n;
      });
      setTick(t=>t+1);
    },3000);
    return()=>clearInterval(id);
  },[]);

  const aqiC=v.aqi<50?EM:v.aqi<100?"#F59E0B":"#EF4444";
  const aqiL=v.aqi<50?"Good":v.aqi<100?"Moderate":"Poor";
  const humC=v.humid>=30&&v.humid<=60?EM:"#F59E0B";
  const tmpC=v.temp>=18&&v.temp<=26?EM:"#F59E0B";
  const dustC=v.dust<0.12?EM:v.dust<0.25?"#F59E0B":"#EF4444";
  const dustL=v.dust<0.12?"Clean":v.dust<0.25?"Moderate":"High";

  const Trend=({cur,prv})=>{
    const up=cur>prv,same=cur===prv;
    return same?null:<span style={{fontSize:10,color:up?"#F59E0B":EM,marginLeft:4}}>{up?"▲":"▼"}</span>;
  };

  return(
    <Glass glow style={{marginBottom:12}} p={0}>
      <div style={{padding:"14px 16px 10px",borderBottom:"1px solid rgba(255,255,255,0.05)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <p style={{fontSize:10,letterSpacing:2.5,color:"rgba(255,255,255,0.25)",fontWeight:700}}>LIVE ENVIRONMENT</p>
          <p style={{fontSize:14,fontWeight:700,color:"#fff",marginTop:2}}>{room||"My Room"}</p>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,background:"rgba(16,185,129,0.08)",border:"1px solid rgba(16,185,129,0.18)",borderRadius:100,padding:"5px 12px"}}>
          <div style={{width:5,height:5,borderRadius:"50%",background:EM,animation:"pulse 1.5s ease infinite"}}/>
          <span style={{fontSize:9,color:EM,fontWeight:700,letterSpacing:1.5}}>LIVE</span>
        </div>
      </div>

      {/* AQI hero */}
      <div style={{padding:"16px",borderBottom:"1px solid rgba(255,255,255,0.05)",display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:68,height:68,borderRadius:20,background:`${aqiC}12`,border:`1px solid ${aqiC}30`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all 0.6s ease"}}>
          <span style={{fontSize:24,fontWeight:800,color:aqiC,lineHeight:1,transition:"color 0.6s"}}>{v.aqi}</span>
          <span style={{fontSize:8,color:aqiC,fontWeight:700,letterSpacing:1.5}}>AQI</span>
        </div>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <span style={{fontSize:16,fontWeight:800,color:aqiC,transition:"color 0.6s"}}>{aqiL}</span>
            <span style={{fontSize:9,color:aqiC,background:`${aqiC}12`,border:`1px solid ${aqiC}25`,borderRadius:100,padding:"2px 8px",fontWeight:700}}>AIR QUALITY</span>
          </div>
          <div style={{height:5,borderRadius:3,background:"rgba(255,255,255,0.06)",overflow:"hidden",marginBottom:5}}>
            <div style={{height:"100%",width:`${Math.min(v.aqi,200)/2}%`,background:`linear-gradient(90deg,${EM},${aqiC})`,borderRadius:3,transition:"width 1s cubic-bezier(0.16,1,0.3,1)"}}/>
          </div>
          <p style={{fontSize:10,color:"rgba(255,255,255,0.28)"}}>BioSmart actively filtering</p>
        </div>
      </div>

      {/* Sensor row — Temp, Humid, Dust */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr"}}>
        {[
          {icon:"🌡️",label:"TEMP",  value:`${v.temp}°`,  sub:"C",  color:tmpC,  good:v.temp>=18&&v.temp<=26,  gt:"Optimal",gb:"Monitor", pv:prev.temp},
          {icon:"💧",label:"HUMIDITY",value:`${Math.round(v.humid)}`, sub:"%", color:humC, good:v.humid>=30&&v.humid<=60, gt:"Ideal",  gb:"Monitor", pv:prev.humid},
          {icon:"🌫️",label:"DUST PM2.5",value:`${(v.dust*1000).toFixed(0)}`,sub:"μg",color:dustC,good:v.dust<0.12,gt:"Clean",gb:dustL,pv:prev.dust},
        ].map(({icon,label,value,sub,color,good,gt,gb,pv},i)=>(
          <div key={label} style={{padding:"13px 8px",textAlign:"center",borderLeft:i>0?"1px solid rgba(255,255,255,0.04)":"none",transition:"background 0.5s"}}>
            <div style={{fontSize:18,marginBottom:5}}>{icon}</div>
            <p style={{fontSize:9,color:"rgba(255,255,255,0.25)",fontWeight:700,letterSpacing:1,marginBottom:3}}>{label}</p>
            <p style={{fontSize:17,fontWeight:800,color,lineHeight:1,transition:"color 0.6s"}}>
              {value}<span style={{fontSize:9,color:`${color}88`}}>{sub}</span>
              <Trend cur={parseFloat(value)} prv={parseFloat(pv)}/>
            </p>
            <p style={{fontSize:9,color:good?EM:"#F59E0B",marginTop:3,fontWeight:600}}>{good?gt:gb}</p>
          </div>
        ))}
      </div>
    </Glass>
  );
}

  const pl=PLACEMENT[room]||PLACEMENT["Living Room"];

  useEffect(()=>{
    navigator.mediaDevices?.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}})
      .then(stream=>{if(videoRef.current){videoRef.current.srcObject=stream;videoRef.current.play().then(()=>setCamReady(true))}})
      .catch(()=>setCamErr(true));
    return()=>{
      if(videoRef.current?.srcObject)videoRef.current.srcObject.getTracks().forEach(t=>t.stop());
      cancelAnimationFrame(raf.current);
      aiTimers.current.forEach(clearTimeout);
    };
  },[]);

  const startScan=()=>{
    vibe("med");setPhase("scanning");setScanPct(0);setSelZone(null);

        setAiAdvice(adviceSeq[i]||adviceSeq[adviceSeq.length-1]);

        if(i>0)vibe("light");

    });
    t0.current=performance.now();

function BioMap({coords,live,place}){
  const [ping,setPing]=useState(0);
  const raf=useRef(null),last=useRef(0);
  useEffect(()=>{
    const tick=ts=>{if(ts-last.current>55){setPing(p=>(p+1)%100);last.current=ts}raf.current=requestAnimationFrame(tick)};
    raf.current=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf.current);
  },[]);
  const W=400,H=210,seed=Math.abs(Math.round(coords[0]*1000+coords[1]*1000));
  const rng=n=>((seed*9301+n*49297+233280)%233280)/233280;
  const blk=Array.from({length:18},(_,i)=>({x:rng(i*3+1)*(W-60)+5,y:rng(i*3+2)*(H-40)+5,w:15+rng(i*3+3)*40,h:10+rng(i*5+1)*28,o:0.03+rng(i)*0.05}));
  const hs=Array.from({length:8},(_,i)=>({y:20+rng(i*13)*(H-40),o:0.08+rng(i)*0.12,w:0.5+rng(i*7)*1.5}));
  const vs=Array.from({length:10},(_,i)=>({x:10+rng(i*17+5)*(W-20),o:0.08+rng(i+3)*0.12,w:0.5+rng(i*11)*1.5}));
  const mY=H*0.45+rng(99)*30,mX=W*0.3+rng(88)*60;
  const pR=10+(ping/100)*52,pO=(1-ping/100)*0.65;
  return(
    <div style={{position:"relative",borderRadius:14,overflow:"hidden",height:H,border:"1px solid rgba(16,185,129,0.22)",background:"#040c08"}}>
      <svg width="100%" height="100%" viewBox={`0 0 ${W} ${H}`} style={{position:"absolute",inset:0}}>
        <defs>
          <radialGradient id="mv" cx="50%" cy="50%" r="55%"><stop offset="0%" stopColor="transparent"/><stop offset="100%" stopColor="rgba(0,0,0,0.72)"/></radialGradient>
          <radialGradient id="mg" cx="50%" cy="50%" r="60%"><stop offset="0%" stopColor="rgba(16,185,129,0.07)"/><stop offset="100%" stopColor="transparent"/></radialGradient>
        </defs>
        <rect width={W} height={H} fill="#040c08"/><rect width={W} height={H} fill="url(#mg)"/>
        {Array.from({length:18},(_,i)=><line key={`gv${i}`} x1={i*(W/18)} y1="0" x2={i*(W/18)} y2={H} stroke="rgba(16,185,129,0.04)" strokeWidth=".5"/>)}
        {Array.from({length:11},(_,i)=><line key={`gh${i}`} x1="0" y1={i*(H/11)} x2={W} y2={i*(H/11)} stroke="rgba(16,185,129,0.04)" strokeWidth=".5"/>)}
        {blk.map((b,i)=><rect key={i} x={b.x} y={b.y} width={b.w} height={b.h} fill={`rgba(16,185,129,${b.o})`} rx="1"/>)}
        {hs.map((s,i)=><line key={`h${i}`} x1="0" y1={s.y} x2={W} y2={s.y} stroke={`rgba(16,185,129,${s.o})`} strokeWidth={s.w}/>)}
        {vs.map((s,i)=><line key={`v${i}`} x1={s.x} y1="0" x2={s.x} y2={H} stroke={`rgba(16,185,129,${s.o})`} strokeWidth={s.w}/>)}
        <line x1="0" y1={mY} x2={W} y2={mY} stroke="rgba(16,185,129,0.28)" strokeWidth="2"/>
        <line x1={mX} y1="0" x2={mX} y2={H} stroke="rgba(16,185,129,0.2)" strokeWidth="1.5"/>
        <circle cx={W/2} cy={H/2} r={pR} fill="none" stroke={EM} strokeWidth="1" opacity={pO}/>
        <circle cx={W/2} cy={H/2} r={pR*.55} fill="none" stroke={EM} strokeWidth=".7" opacity={pO*.5}/>
        <circle cx={W/2} cy={H/2} r="7" fill={EM} opacity=".9"/><circle cx={W/2} cy={H/2} r="3" fill="#fff"/>
        <rect width={W} height={H} fill="url(#mv)"/>
      </svg>
      <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-140%)",zIndex:10,pointerEvents:"none"}}>
        <div style={{background:"rgba(0,0,0,0.9)",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",border:"1px solid rgba(16,185,129,0.38)",borderRadius:9,padding:"5px 12px",whiteSpace:"nowrap"}}>

        </div>
        <div style={{width:1,height:12,background:`linear-gradient(${EM},transparent)`,margin:"0 auto"}}/>

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2" y="7" width="20" height="14" rx="2" stroke={EM} strokeWidth="1.8"/><circle cx="12" cy="14" r="3" stroke={EM} strokeWidth="1.8"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke={EM} strokeWidth="1.8"/></svg>
          </div>
          <div style={{flex:1}}>
            <p style={{fontSize:13,fontWeight:700,color:"#fff",marginBottom:2}}>Camera Placement Scan</p>

          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke={EM} strokeWidth="2" strokeLinecap="round"/></svg>
        </Tap>
      </div>
      <Glass glow style={{marginBottom:14,overflow:"hidden"}} p={0}>
        <div style={{position:"relative",height:240,background:"#030d07",overflow:"hidden"}}>
          <svg style={{position:"absolute",inset:0,width:"100%",height:"100%"}} viewBox="0 0 400 240" preserveAspectRatio="none">
            {Array.from({length:11},(_,i)=><line key={`v${i}`} x1={i*40} y1="0" x2={i*40} y2="240" stroke="rgba(16,185,129,0.06)" strokeWidth=".5"/>)}
            {Array.from({length:7},(_,i)=><line key={`h${i}`} x1="0" y1={i*40} x2="400" y2={i*40} stroke="rgba(16,185,129,0.06)" strokeWidth=".5"/>)}
          </svg>
          <div style={{position:"absolute",inset:"26px 34px",display:"grid",gridTemplateColumns:"repeat(18,1fr)",gridTemplateRows:"repeat(10,1fr)",gap:2}}>
            {Array.from({length:180},(_,i)=>{const sat=res&&i>=132,lit=scanning&&i<=(prog/100)*180;return<div key={i} style={{borderRadius:1,background:sat?"rgba(239,68,68,0.55)":phase==="done"?"rgba(16,185,129,0.65)":lit?"rgba(16,185,129,0.4)":"rgba(255,255,255,0.06)",transition:phase==="done"?"background 0.5s ease":"none"}}/>})}
          </div>
          {scanning&&<div style={{position:"absolute",left:0,right:0,top:26+sy,height:2,background:`linear-gradient(90deg,transparent 2%,${EM}aa 30%,${EM} 50%,${EM}aa 70%,transparent 98%)`,boxShadow:`0 0 20px ${EM}`,pointerEvents:"none",willChange:"top",transition:"top 0.05s linear"}}/>}
          {corners.map(([x,y],i)=><div key={i} style={{position:"absolute",width:28,height:28,top:y?"auto":10,bottom:y?10:"auto",left:x?"auto":10,right:x?10:"auto",borderTop:y?"none":`2px solid ${EM}`,borderBottom:y?`2px solid ${EM}`:"none",borderLeft:x?"none":`2px solid ${EM}`,borderRight:x?`2px solid ${EM}`:"none",opacity:0.8}}/>)}
          <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"8px 16px",background:"rgba(0,0,0,0.72)",backdropFilter:"blur(8px)",WebkitBackdropFilter:"blur(8px)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:10,letterSpacing:2,color:EM,fontWeight:700}}>{scanning?`SCANNING ${prog}%`:phase==="done"?"● COMPLETE":"○ NEURAL SCAN READY"}</span>
            {scanning&&<div style={{width:72,height:2,background:"rgba(255,255,255,0.08)",borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:`${prog}%`,background:EM,transition:"width 0.1s linear"}}/></div>}
          </div>
        </div>
      </Glass>
      {res&&(
        <Glass glow style={{marginBottom:14,animation:"fadeUp 0.4s ease"}} p={16}>
          <p style={{fontSize:10,letterSpacing:2,color:EM,fontWeight:700,marginBottom:12}}>● FILTER ANALYSIS — BS-120G-V2</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[["Filter Density",`${res.den}%`,res.den>60?EM:"#F59E0B"],["Particle Size",res.par,EM],["Efficiency",res.eff,EM],["Days Left",`${res.days}d`,EM]].map(([lb,vl,col])=>(
              <div key={lb} style={{padding:"12px 14px",background:"rgba(16,185,129,0.04)",borderRadius:12,border:"1px solid rgba(16,185,129,0.1)",animation:"ringPop 0.4s cubic-bezier(0.34,1.56,0.64,1)"}}>
                <p style={{fontSize:9,color:"rgba(255,255,255,0.28)",letterSpacing:1.5,fontWeight:700,marginBottom:5}}>{lb.toUpperCase()}</p>
                <p style={{fontSize:19,fontWeight:800,color:col}}>{vl}</p>
              </div>
            ))}
          </div>
        </Glass>
      )}
      <Tap onTap={scan} off={scanning} vt="med" style={{width:"100%",padding:"16px",borderRadius:18,textAlign:"center",background:scanning?"rgba(16,185,129,0.05)":"rgba(16,185,129,0.1)",border:`1px solid rgba(16,185,129,${scanning?.12:.4})`,color:scanning?"rgba(16,185,129,0.35)":EM,fontSize:12,fontWeight:700,letterSpacing:3.5,boxShadow:scanning?"none":`0 0 30px rgba(16,185,129,0.12)`,transition:"all 0.4s"}}>
        {scanning?`ANALYZING… ${prog}%`:phase==="done"?"RE-SCAN FILTER":"INITIATE NEURAL SCAN"}
      </Tap>
    </div>
  );
}

// ── ROOT ──────────────────────────────────────────────────────────────────────
function App(){
  const [onboarded,setOnboarded]=useState(()=>!!S.g("bs_onboarded"));
  const [tab,setTab]=useState("monitor");
  const [cameraOpen,setCameraOpen]=useState(false);
  const [room,setRoom]=useState(()=>S.g("bs_room")||"Living Room");
  const [deviceName,setDeviceName]=useState(()=>S.g("bs_name")||"BioSmart");
  const [life,setLife]=useState(()=>{
    const sv=S.g("bs_life"),sd=S.g("bs_date");
    if(sv&&sd){const d=(Date.now()-parseInt(sd))/86400000;return Math.max(0,parseFloat(sv)-d*DECAY*100)}
    return 87.3;
  });
  const [anim,setAnim]=useState(0);
  const [taps,setTaps]=useState(0);
  const tmr=useRef(null);

  useEffect(()=>{S.s("bs_life",life.toString());S.s("bs_date",Date.now().toString())},[life]);

  const runAnim=useCallback((tgt)=>{
    let s=null;
    const step=ts=>{if(!s)s=ts;const p=Math.min((ts-s)/2000,1);setAnim((1-Math.pow(1-p,4))*tgt);if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  },[]);

  useEffect(()=>{
    runAnim(life);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const sp=document.getElementById("splash");
      if(sp){sp.classList.add("hide");setTimeout(()=>sp.remove(),700)}
    }));
  },[]);

  const switchTab=useCallback(t=>{vibe("light");setTab(t)},[]);
  const logoTap=useCallback(()=>{
    setTaps(n=>{const nx=n+1;if(nx>=5){setLife(100);runAnim(100);S.s("bs_life","100");vibe("heavy");return 0}clearTimeout(tmr.current);tmr.current=setTimeout(()=>setTaps(0),1800);return nx});
  },[]);

  const handleOnboard=useCallback(({life:l,room:r,deviceName:dn})=>{
    setLife(l);setRoom(r);setDeviceName(dn);setOnboarded(true);
    setTimeout(()=>runAnim(l),400);
  },[]);

  if(!onboarded)return <Onboarding onComplete={handleOnboard}/>;

  const pages={monitor:MonitorPage,biosync:BioSyncPage,aiscan:AIScanPage,data:DatasheetPage};
  const Page=pages[tab];

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",maxWidth:480,margin:"0 auto",background:"#000",position:"relative",overflow:"hidden"}}>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",background:"radial-gradient(ellipse 90% 55% at 50% -8%,rgba(16,185,129,0.1) 0%,transparent 60%)"}}/>
      <div key={tab} style={{flex:1,overflowY:"auto",overflowX:"hidden",position:"relative",zIndex:1,WebkitOverflowScrolling:"touch",overscrollBehavior:"contain",animation:"pageIn 0.3s cubic-bezier(0.16,1,0.3,1) both"}}>
        <Page life={life} anim={anim} taps={taps} onTap={logoTap} room={room} deviceName={deviceName} onOpenCamera={()=>setCameraOpen(true)}/>
      </div>
      <Dock tab={tab} setTab={switchTab}/>
      {cameraOpen&&<CameraOverlay onClose={()=>setCameraOpen(false)} room={room}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
